    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-ee">EE</span>
                <span class="logo-text">EHEY<span>ENTERTAINMENT</span></span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html">Beranda</a></li>
                <li><a href="creator.html" class="aktif">Anggota</a></li>
                <li><a href="index.html#daftar">Daftar</a></li>
            </ul>
            <div class="menu-toggle" id="mobile-menu">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <section class="section" style="padding-top: 8rem;">
        <div class="container">
            <h2 class="section-title">👑 Pengurus & Staff</h2>
            <p class="section-desc">Tim inti EHEY ENTERTAINMENT</p>
            <div class="profiles-grid" id="staffArea"></div>

            <h2 class="section-title" style="margin-top: 4rem;">⭐ Para Member</h2>
            <p class="section-desc">Kreator yang sudah bergabung bersama kami</p>
            <div class="profiles-grid" id="memberArea"></div>

            <div class="tambah-member-box">
                <button id="tambahMemberManual" class="btn-primary">
                    <i class="fas fa-user-plus"></i> Tambah Member Manual
                </button>
            </div>
        </div>
    </section>

    <div id="formTambahModal" class="modal">
        <div class="modal-konten">
            <span class="tutup">&times;</span>
            <h3>Tambah Member Baru</h3>
            <form id="formTambahMember">
                <label>Foto Profil (URL):</label>
                <input type="url" id="mFoto" required>
                <label>Nama Lengkap:</label>
                <input type="text" id="mNama" required>
                <label>Username TikTok:</label>
                <input type="text" id="mUser" required>
                <label>Tautan Profil TikTok:</label>
                <input type="url" id="mTautan" required>
                <button type="submit" class="btn-primary">Simpan Member</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 EHEY ENTERTAINMENT — Gorontalo, Indonesia</p>
        <p class="footer-links">
            <a href="syarat.html">Syarat & Ketentuan</a> | 
            <a href="privasi.html">Kebijakan Privasi</a>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
